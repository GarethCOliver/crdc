name: Build and Validate IETF Internet-Draft

on:
  push:
    branches:
      - main
    tags:
      - "draft-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ietf-draft:
    name: Build RFC XML, TXT, HTML, Readable MD & Run idnits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby for kramdown-rfc
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Set up Python for xml2rfc
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install IETF Tooling (kramdown-rfc, xml2rfc, libxml2-utils, pandoc, idnits)
        run: |
          gem install kramdown-rfc2629
          pip install --upgrade pip xml2rfc
          sudo apt-get update && sudo apt-get install -y libxml2-utils pandoc curl
          sudo curl -sSL https://raw.githubusercontent.com/ietf-tools/idnits/main/idnits -o /usr/local/bin/idnits
          sudo chmod +x /usr/local/bin/idnits

      - name: Determine Draft Name and Revision
        id: meta
        run: |
          BASE_NAME="draft-campbell-crdc"
          if [[ "${GITHUB_REF}" == refs/tags/draft-* ]]; then
            DOC_NAME="${GITHUB_REF#refs/tags/}"
          else
            DOC_NAME="${BASE_NAME}-00"
          fi
          echo "base_name=${BASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "doc_name=${DOC_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate RFCXML v3, TXT, HTML, and Readable Markdown
        run: |
          sed "s/draft-campbell-crdc-latest/${{ steps.meta.outputs.doc_name }}/g" draft-campbell-crdc.md > "/tmp/${{ steps.meta.outputs.doc_name }}-kramdown.md"
          kramdown-rfc "/tmp/${{ steps.meta.outputs.doc_name }}-kramdown.md" > "${{ steps.meta.outputs.doc_name }}.xml"
          xmllint --noout "${{ steps.meta.outputs.doc_name }}.xml"
          xml2rfc --v3 --text --html "${{ steps.meta.outputs.doc_name }}.xml"
          pandoc -f html -t gfm --wrap=none "${{ steps.meta.outputs.doc_name }}.html" -o "${{ steps.meta.outputs.doc_name }}.md"

      - name: Run IETF idnits Check
        run: |
          idnits "${{ steps.meta.outputs.doc_name }}.txt" || true

      - name: Upload Built IETF Draft Artifacts (XML, TXT, HTML, MD)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.doc_name }}
          path: |
            ${{ steps.meta.outputs.doc_name }}.xml
            ${{ steps.meta.outputs.doc_name }}.txt
            ${{ steps.meta.outputs.doc_name }}.html
            ${{ steps.meta.outputs.doc_name }}.md
